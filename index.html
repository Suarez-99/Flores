<meta charset="UTF-8">

<title>Compilando un regalo 💛</title>
<meta name="theme-color" content="#050807">

<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    background:#050807; color:#d9ffe5; font-family:"Courier New",monospace;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .scanlines {
    position:fixed; inset:0; pointer-events:none; opacity:.08;
    background:repeating-linear-gradient(to bottom, transparent 0 3px, #8affad 4px);
    z-index:20;
  }
  .glow { position:fixed; width:500px; height:500px; border-radius:50%;
    background:#00ff6640; filter:blur(100px); opacity:.25; }
  .terminal {
    width:min(900px,92vw); height:min(700px,94vh); background:#07100b;
    border:1px solid #22ff6680; border-radius:14px; box-shadow:0 0 45px #00ff6630;
    overflow:hidden; position:relative;
  }
  .bar { height:42px; background:#101814; display:flex; align-items:center; padding:0 15px; gap:8px; }
  .dot { width:12px;height:12px;border-radius:50%; background:#ff5f56; }
  .dot.y { background:#ffbd2e; }.dot.g { background:#27c93f; }
  .title { flex:1;text-align:center;color:#8fa996;font-size:13px;margin-right:45px; }
  .screen { padding:18px 28px; height:calc(100% - 42px); overflow:auto; }
  .prompt { color:#55ff88; }
  #terminalText { line-height:1.65; white-space:pre-wrap; font-size:clamp(13px,2vw,16px); }
  .cursor { display:inline-block;width:9px;height:1em;background:#55ff88;vertical-align:-2px;animation:blink .7s infinite; }
  @keyframes blink {50%{opacity:0}}
  .progress { margin:25px 0; color:#70ff98; }
  .progressbar { border:1px solid #38ff75; padding:3px; width:min(650px,100%); }
  .fill { height:16px;width:0;background:#39ff72;box-shadow:0 0 15px #39ff72; transition:width .12s; }
  .hidden { display:none!important; }
  .gift { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; animation:appear 1.5s ease; }
  @keyframes appear {from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
  h1 { font-size:clamp(26px,5.2vw,52px); margin:6px 0; color:#ffe94a;
      text-shadow:0 0 12px #ffd900,0 0 35px #ffbd00; }
  .message { max-width:680px; font-family:Arial,sans-serif; font-size:clamp(15px,2.4vw,20px); line-height:1.5; margin:8px 0;color:#fff6bf; }
  .bouquet { width:min(270px,62vw); margin:0 0 4px; }
  .ramo { width:100%; height:auto; display:block; overflow:visible; filter:drop-shadow(0 0 14px #ffd90066); }
  .mecer { transform-box:view-box; transform-origin:180px 250px; animation:mecer 3.2s ease-in-out infinite; }
  @keyframes mecer { 0%,100%{transform:rotate(-1.6deg)} 50%{transform:rotate(1.6deg)} }
  #petalos { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:5; }
  .petalo { position:absolute; top:-30px; width:11px; height:18px; border-radius:60% 60% 60% 60% / 80% 80% 40% 40%;
    background:#ffd83d; opacity:.85; animation:caer linear infinite; }
  @keyframes caer { to { transform:translate(var(--dx), 110vh) rotate(var(--rot)); opacity:.15; } }
  @media (prefers-reduced-motion: reduce) { .mecer, .petalo { animation:none; } }
  .prompt { margin-bottom:6px; }
  .gap { display:block; height:.55em; }
  @media (max-height:720px) { .bouquet { width:190px; } h1 { font-size:clamp(24px,4.4vw,40px); } .message { font-size:15px; } }
  .heart { color:#ff6b91; text-shadow:0 0 15px #ff326b; }
  button { margin:14px 0 6px; padding:13px 22px; border:1px solid #ffe94a; background:#151207; color:#ffe94a;
    border-radius:8px; font:bold 15px monospace; cursor:pointer; box-shadow:0 0 15px #ffd90030; }
  button:hover { background:#ffe94a;color:#111; }
  #fireworks { position:fixed; inset:0; pointer-events:none; z-index:10; }
  .particle { position:absolute; width:7px;height:7px;border-radius:50%; background:#ffd83d; box-shadow:0 0 12px #ffd83d; animation:explode 1.2s ease-out forwards; }
  @keyframes explode {to{transform:translate(var(--x),var(--y));opacity:0}}
  .signature { margin-top:18px;color:#9deeb2;font-size:14px; }
</style>

<script>
const lines = [
  "> Iniciando sistema...",
  "> Cargando módulo: recuerdos.exe",
  "> Buscando a la persona más especial...",
  "> Persona encontrada: GIULIANA ❤️",
  "",
  "> Analizando sentimientos...",
  "  amor: ∞",
  "  felicidad: ∞",
  "  ganas_de_abrazarte: true",
  "",
  "> Compilando regalo...",
];

let i=0, char=0, text="", timer;
const out=document.getElementById("terminalText");
const progress=document.getElementById("progress");
const fill=document.getElementById("fill");
const percent=document.getElementById("percent");

function typeLine(){
  if(i>=lines.length){ startProgress(); return; }
  if(char<lines[i].length){
    text += lines[i][char++];
    out.textContent=text;
    timer=setTimeout(typeLine, 24);
  } else {
    text+="\n"; i++; char=0;
    timer=setTimeout(typeLine, 150);
  }
}
function startProgress(){
  progress.classList.remove("hidden");
  let n=0;
  const p=setInterval(()=>{
    n += Math.floor(Math.random()*7)+3;
    if(n>=100){n=100;clearInterval(p);setTimeout(showGift,500);}
    fill.style.width=n+"%"; percent.textContent=n+"%";
  },110);
}
function showGift(){
  document.getElementById("boot").classList.add("hidden");
  document.getElementById("gift").classList.remove("hidden");
  fireworks();
  petalos();
}
function petalos(){
  const box=document.getElementById("petalos");
  box.textContent="";
  const colores=["#ffd83d","#ffe14d","#f5b800","#fff08a"];
  for(let k=0;k<22;k++){
    const p=document.createElement("span"); p.className="petalo";
    p.style.left=Math.random()*100+"vw";
    p.style.background=colores[k%colores.length];
    p.style.animationDuration=(6+Math.random()*6)+"s";
    p.style.animationDelay=(-Math.random()*8)+"s";
    p.style.setProperty("--dx",(Math.random()*120-60)+"px");
    p.style.setProperty("--rot",(Math.random()*540-270)+"deg");
    box.appendChild(p);
  }
}
function fireworks(){
  const box=document.getElementById("fireworks");
  for(let k=0;k<55;k++){
    const p=document.createElement("span"); p.className="particle";
    p.style.left=(45+Math.random()*10)+"vw"; p.style.top=(35+Math.random()*15)+"vh";
    const a=Math.random()*Math.PI*2, r=80+Math.random()*260;
    p.style.setProperty("--x",Math.cos(a)*r+"px"); p.style.setProperty("--y",Math.sin(a)*r+"px");
    p.style.animationDelay=(Math.random()*.35)+"s"; box.appendChild(p);
    setTimeout(()=>p.remove(),1600);
  }
}
function restart(){
  clearTimeout(timer); i=0;char=0;text="";
  document.getElementById("petalos").textContent="";
  document.getElementById("gift").classList.add("hidden");
  document.getElementById("boot").classList.remove("hidden");
  progress.classList.add("hidden");fill.style.width="0%";percent.textContent="0%";
  out.textContent="";
  typeLine();
}
typeLine();
</script>
